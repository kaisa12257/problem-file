<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>진실 탐구 프로젝트</title>
<style>
body {
  margin:0;
  font-family:"Noto Sans KR",sans-serif;
  background-color:#fdfdfd;
  color:#111;
  overflow:hidden;
}
#brain-bg {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30vw;
  color:rgba(0,0,0,0.08);
  user-select:none;
  pointer-events:none;
  z-index:0;
}
#main {
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  gap:20px;
}
button.topic {
  background:#fff;
  border:2px solid #555;
  border-radius:10px;
  padding:15px 25px;
  font-size:1.2em;
  cursor:pointer;
  transition:.3s;
}
button.topic:hover {background:#eee;}
.section {
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  text-align:center;
  padding:40px;
}
.desc {font-size:1.1em; line-height:1.6em; margin-bottom:20px;}
.article-box {
  width:90%;
  overflow-x:auto;
  white-space:nowrap;
  border-top:1px solid #aaa;
  border-bottom:1px solid #aaa;
  padding:20px;
  font-size:1em;
}
.article-box::-webkit-scrollbar{display:none;}
.article-box p{display:inline-block; width:300vw;}
.link {margin-top:10px;}
.quiz {
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  height:100vh;
  padding:30px;
  position:relative;
}
.question {
  font-size:1.2em;
  margin-bottom:20px;
}
.choice {
  display:block;
  margin:8px;
  padding:10px 20px;
  border:2px solid #333;
  border-radius:6px;
  cursor:pointer;
  background:#fff;
}
.choice:hover {background:#eee;}
.arrow-left {
  position:fixed;
  top:50%;
  left:25px;
  transform:translateY(-50%);
  font-size:2.5em;
  cursor:pointer;
  color:#007BFF;
  user-select:none;
  z-index:10;
  display:none;
}
.arrow-right {
  position:fixed;
  top:50%;
  right:25px;
  transform:translateY(-50%);
  font-size:2.5em;
  cursor:pointer;
  color:#007BFF;
  user-select:none;
  z-index:10;
  display:none;
}
.result {font-size:2em;margin-top:20px;}
</style>
</head>
<body>
<!-- 좌측 상단 돌아가기 버튼 -->
<div style="position: fixed; top: 20px; left: 20px; z-index: 1000;">
<button 
  onclick="window.open('https://nojeonggyun.github.io/webprogarmming/team/Project/main.html', '_self')" 
  style="padding:8px 14px; font-size:1rem; background:#fff; border:2px solid #007BFF; border-radius:8px; cursor:pointer; color:#007BFF; font-weight:bold; transition:0.3s;">
  ← 돌아가기
</button>

</div>


<div id="brain-bg">🧠</div>
<div class="arrow-left" id="leftArrow" onclick="goBack()">⬅</div>
<div class="arrow-right" id="rightArrow" onclick="nextQuestion()">➡</div>

<div id="main">
  <h1>진실 탐구 프로젝트</h1>
  <button class="topic" onclick="openTopic('cicada')">시카다 3301</button>
  <button class="topic" onclick="openTopic('freemason')">프리메이슨</button>
  <button class="topic" onclick="openTopic('illuminati')">일루미나티</button>
  <button class="topic" onclick="openTopic('flatearth')">지구평평설</button>
  <button class="topic" onclick="openTopic('creationism')">창조론</button>
</div>

<div id="topicPage" class="section">
  <div class="desc" id="desc"></div>
  <div class="article-box" id="article"></div>
  <div class="link" id="source"></div>
  <button id="quizBtn" onclick="startQuiz()">퀴즈시작</button>
</div>

<!-- 찬반 선택 화면 -->
<div id="preQuiz" class="section">
  <h2 id="preTitle"></h2>
  <div id="preButtons" style="display:flex; gap:20px; margin-top:20px;"></div>
</div>

<div id="quizPage" class="quiz">
  <div class="question" id="question"></div>
  <div id="choices"></div>
  <div class="result" id="result"></div>
</div>

      ["이념?",["이성 자유","권력","전쟁","종교"],0],
      ["대립 세력?",["교회","군","상인","시민"],0],
      ["해산 이유?",["탄압","내분","재정","전쟁"],0],
      ["오늘날 평판?",["음모론","학회","없음","예술단체"],0],
      ["상징?",["피라미드 눈","별","해골","돔"],0],
      ["탄생 지역?",["독일","프랑스","영국","미국"],0],
      ["회원층?",["지식인","농민","군인","상인"],0],
      ["현재 존재?",["불분명","확실","없음","변형"],0]
    ]
  },
  flatearth:{
    desc:"지구평평설은 지구가 구형이 아니라 평면이라고 믿는 사상으로,<br>과학계와 대립하며,<br>인터넷 시대에 다시 확산되었다.",
    article:"고대 문명은 평면지구를 믿었다.<br>코페르니쿠스 이후 구형설이 정립됐다.<br>일부는 이를 거부했다.<br>20세기 중반 평평설이 부활했다.<br>인터넷으로 확산되었다.<br>유튜브에서 평평설 영상이 유행했다.<br>NASA의 사진이 조작됐다고 주장한다.<br>과학자들은 공개 실험으로 반박했다.<br>여전히 일부 신봉자가 존재한다.<br>대표적인 현대 음모론으로 꼽힌다.",
    link:"https://en.wikipedia.org/wiki/Flat_Earth",
    quiz:[
      ["주장은?",["지구는 평평하다","지구는 둥글다","태양이 돈다","달이 돈다"],0],
      ["현대 확산 경로?",["인터넷","신문","라디오","책"],0],
      ["비판 대상?",["NASA","UN","WHO","EU"],0],
      ["등장 매체?",["유튜브","라디오","영화","신문"],0],
      ["신봉자 수?",["소수","다수","없음","비밀"],0],
      ["근거 주장?",["사진 조작","문헌","물리학","철학"],0],
      ["반박자는?",["과학자","언론인","종교인","연예인"],0],
      ["평판?",["음모론","정설","학설","진리"],0],
      ["재등장 시기?",["20세기","18세기","21세기","19세기"],0],
      ["모델 형태?",["원판","삼각형","정육면체","타원"],0]
    ]
  },
  creationism:{
    desc:"창조론은 신이 세상과 생명을 창조했다는 믿음으로,<br>진화론과 대립하며,<br>종교적 논쟁의 중심에 서 있다.",
    article:"성경의 창세기에 기반을 둔다.<br>다윈의 진화론과 대립한다.<br>미국에서 교육 논쟁이 격렬했다.<br>법정에서도 논의된 바 있다.<br>과학계는 증거 부족을 지적했다.<br>신앙인들은 상징성을 강조했다.<br>일부는 창조와 진화의 조화를 주장한다.<br>여러 종교에서 각기 다른 해석을 갖는다.<br>지속적인 철학적 논쟁이 이어진다.<br>현대에도 토론이 계속되고 있다.",
    link:"https://en.wikipedia.org/wiki/Creationism",
    quiz:[
      ["창조론의 기반?",["성경 창세기","다윈 이론","철학서","역사서"],0],
      ["대립 이론?",["진화론","상대성이론","양자론","기후론"],0],
      ["논쟁 지역?",["미국","한국","중국","일본"],0],
      ["논쟁 분야?",["교육","군사","정치","예술"],0],
      ["신앙적 의미?",["중요","없음","부분적","불명"],0],
      ["비판 이유?",["증거 부족","비윤리","비과학","종교 탄압"],0],
      ["타협 이론?",["조화론","배척","무신론","모순론"],0],
      ["논의 형태?",["철학적","정치적","경제적","감정적"],0],
      ["핵심 인물?",["종교학자","과학자","정치가","철학자"],0],
      ["현대 논의?",["지속","종결","감소","폐지"],0]
    ]
  }
};

let currentTopic=null;
let qIndex=0,score=0;
const leftArrow=document.getElementById('leftArrow');
const rightArrow=document.getElementById('rightArrow');

function openTopic(t){
  currentTopic=topics[t];
  document.getElementById('main').style.display='none';
  document.getElementById('topicPage').style.display='flex';
  document.getElementById('desc').innerHTML=currentTopic.desc;
  document.getElementById('article').innerHTML=currentTopic.article;
  document.getElementById('source').innerHTML=`<a href="${currentTopic.link}" target="_blank">${currentTopic.link}</a>`;
  leftArrow.style.display='block';
  rightArrow.style.display='none';
}

function goBack(){
  const topicPage=document.getElementById('topicPage');
  const quizPage=document.getElementById('quizPage');
  if(quizPage.style.display==='flex'){
    quizPage.style.display='none';
    topicPage.style.display='flex';
    rightArrow.style.display='none';
  } else if(topicPage.style.display==='flex'){
    topicPage.style.display='none';
    document.getElementById('main').style.display='flex';
    leftArrow.style.display='none';
  }
}

function startQuiz(){
  if(currentTopic === topics.flatearth){
    showPreQuestion("지구 평평설에 대한 나의 주장은?", ["찬성", "반대"]);
  }
  else if(currentTopic === topics.creationism){
    showPreQuestion("창조론에 대한 나의 생각은?", ["사실이다", "아니다"]);
  }
  else{
    beginQuiz();
  }
}

function showPreQuestion(title, buttons){
  document.getElementById('topicPage').style.display='none';
  document.getElementById('preQuiz').style.display='flex';
  document.getElementById('preTitle').innerText = title;
  const btnBox = document.getElementById('preButtons');
  btnBox.innerHTML = '';
  let descBox = document.createElement('div');
  descBox.id = "preDesc";
  descBox.style.marginTop = "30px";
  descBox.style.fontSize = "1.1em";
  descBox.style.lineHeight = "1.6em";
  descBox.style.maxWidth = "80%";
  buttons.forEach(text=>{
    const b = document.createElement('button');
    b.className = 'topic';
    b.innerText = text;
    b.onclick = ()=>{ showOpinion(text, descBox); };
    btnBox.appendChild(b);
  });
  document.getElementById('preQuiz').appendChild(descBox);
  leftArrow.style.display='block';
  rightArrow.style.display='none';
}

function showOpinion(choice, descBox){
  descBox.innerHTML = "";
  if(currentTopic === topics.flatearth){
    if(choice === "찬성"){
      descBox.innerHTML = "🌍 <b>찬성 입장:</b> 일부는 인공위성 영상이 조작되었다고 주장하며, 지평선이 평평하다는 관찰을 근거로 듭니다.";
    } else {
      descBox.innerHTML = "🛰️ <b>반대 입장:</b> 과학적 실험과 위성 사진으로 지구가 구형임이 명백히 입증되었습니다.";
    }
    setTimeout(() => { beginQuiz(); }, 2000);
  } 
  else if(currentTopic === topics.creationism){
    if(choice === "사실이다"){
      descBox.innerHTML = "🙏 <b>사실이다 입장:</b> 성경의 창세기를 문자 그대로 믿으며, 모든 생명은 신의 설계로 만들어졌다고 봅니다.";
    } else {
      descBox.innerHTML = "🧬 <b>아니다 입장:</b> 진화론적 증거와 과학적 관찰이 더 많은 데이터를 제공한다고 봅니다.";
    }
    setTimeout(() => { beginQuiz(); }, 2000);
  }
}

function beginQuiz(){
  document.getElementById('topicPage').style.display='none';
  document.getElementById('preQuiz').style.display='none';
  document.getElementById('quizPage').style.display='flex';
  qIndex = 0;
  score = 0;
  showQuestion();
  rightArrow.style.display='block';
}

function showQuestion(){
  let q=currentTopic.quiz[qIndex];
  document.getElementById('question').innerText=q[0];
  const ch=document.getElementById('choices');
  ch.innerHTML='';
  q[1].forEach((c,i)=>{
    let b=document.createElement('div');
    b.className='choice';
    b.innerText=c;
    b.onclick=()=>checkAnswer(i);
    ch.appendChild(b);
  });
  document.getElementById('result').innerText='';
}

function checkAnswer(i){
  const ch = document.querySelectorAll('.choice');
  ch.forEach(c => {
    c.style.background = '#fff';
    c.style.color = '#000';
  });
  ch[i].style.background = '#007BFF';
  ch[i].style.color = '#fff';
  if(i === currentTopic.quiz[qIndex][2]) score++;
  document.getElementById('result').innerText = "";
}

function nextQuestion(){
  if(qIndex<currentTopic.quiz.length-1){
    qIndex++;
    showQuestion();
  } else {
    document.getElementById('choices').innerHTML='';
    document.getElementById('question').innerText='퀴즈 완료!';
    document.getElementById('result').innerText=`맞힌 문제 ${score} / 10`;
    rightArrow.style.display='none';
  }
}
</script>
</body>
</html>
