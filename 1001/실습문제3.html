<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>document.write()로 표 만들기</title>
</head>
<body>
<script>
  document.write("<table border='1'>");
  document.write("<tr>");
  document.write("<th>m</th>");
  for (let i = 0; i < 10; i++) {
    document.write("<th>" + i + "</th>");
  }
  document.write("</tr>");

  document.write("<tr>");
  document.write("<th>m²</th>");
  for (let i = 0; i < 10; i++) {
    document.write("<td>" + (i * i) + "</td>");
  }
  document.write("</tr>");
  document.write("</table>");
</script>
</body>
</html>
