<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>라면을 만드는데 필요한 재료</title>
</head>
<body>
  <h3>라면을 만드는데 필요한 재료</h3>
  <hr>

  <ul id="list"></ul>

  <script>
    let itemlist = ["라면", "계란", "물", "파"];
    let ul = document.getElementById("list");

  
    ul.innerHTML = itemlist.map(item => "<li>" + item + "</li>").join("");
  </script>
</body>
</html>
