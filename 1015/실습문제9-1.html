<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>book 객체 만들기 </title>
</head>
<body>
  <h1>book 객체 만들기</h1>
  <hr>
  <script>
    const book = new Object();
    book.title = "HTML5";
    book.author = "황기태";
    book.price = 2000;

    document.write(
      "<span>제목: " + book.title + " </span>" +
      "<span>저자: " + book.author + " </span>" +
      "<span>가격: " + book.price + "원</span>"
    );
  </script>
</body>
</html>
