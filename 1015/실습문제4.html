<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>방문 시간에 따라 변하는 배경색</title>
</head>
<body>
<h3>일요일은 pink, 다른 요일은 gold <br>배경</h3>
<hr>
<script>
let current = new Date();
let day = current.getDay(); 
if (day === 0) {
    document.body.style.backgroundColor = "pink";
} else {
    document.body.style.backgroundColor = "gold";
}

let dayNames = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];

document.write("오늘은 " + current.getDate() + "일, ");
document.write(dayNames[day] + " ");
</script>
</body>
</html>
