<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>문자열 배열 다루기</title>
</head>
<body>
  <h3>문자열 배열 다루기</h3>
  <hr>

  <script>
    let names = new Array("wonsoun", "jaemoonlee", "kitae", "gracehwang");
    document.write("이름 배열: " + names.join(", ") + "<br>");
    let long = names[0];
    for (let i = 1; i < names.length; i++) {
      if (names[i].length > long.length) {
        long = names[i];
      }
    }
    document.write("가장 긴 이름: " + long + "<br>");
    let first = names[0];
    for (let i = 1; i < names.length; i++) {
      if (names[i] < first) {
        first = names[i];
      }
    }
    document.write("가장 먼저 나오는 이름: " + first + "<br>");
    let sorted = names.slice().sort();
    document.write("증가순 이름: " + sorted.join(", ") + "<br>");
  </script>
</body>
</html>
