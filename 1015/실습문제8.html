<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>16개의 랜덤한 색 만들기</title>
  <style>
    div {
      display: inline-block;
      width: 150px;
      padding: 10px;
         }
  </style>
</head>
<body>
  <h3>16개의 랜덤한 색 만들기</h3>
  <hr>

  <script>
    function randomColor() {
      const r = Math.floor(Math.random() * 256);
      const g = Math.floor(Math.random() * 256);
      const b = Math.floor(Math.random() * 256);
      return `rgb(${r},${g},${b})`;
    }

    for (let i = 0; i < 16; i++) {
      let color = randomColor();
      document.write('<div style="background-color:' + color + ';">' + color + '</div>');
      if ((i + 1) % 4 === 0) {
        document.write("<br>");
      }
    }
  </script>
</body>
</html>
