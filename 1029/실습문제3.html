<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>visibility 프로퍼티</title>
    <style>
        span {
            visibility: hidden;
        }
        button {
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h3>
        다음 빈 곳에 숨은 단어?
        <button onclick="toggleVisibility()">show/hide</button>
    </h3>
    <hr>
    <ul>
        <li>I (<span>love</span>) you.</li>
        <li>CSS is Cascading (<span>Style</span>) Sheet.</li>
        <li>응답하라 (<span>1988</span>).</li>
    </ul>

    <script>
        function toggleVisibility() {
            const spans = document.querySelectorAll("span");
            spans.forEach(span => {
                span.style.visibility = (span.style.visibility === "visible") ? "hidden" : "visible";
            });
        }
    </script>
</body>
</html>
