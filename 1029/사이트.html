<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과목 격파! 마인드맵</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #e6f7ff 0%, #ffffff 100%);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    position: relative;
    color: #333;
  }

  #mindmap-container, #stage-container {
    position: absolute;
    width: 100%;
    height: 100%;
    transition: opacity 0.5s ease-in-out;
  }

  #mindmap-container {
    opacity: 1;
    pointer-events: auto;
  }

  #stage-container {
    opacity: 0;
    pointer-events: none;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  .node {
    border-radius: 50%;
    width: 100px;
    height: 100px;
    text-align: center;
    line-height: 100px;
    cursor: pointer;
    position: absolute;
    border: 4px solid rgba(255,255,255,0.9);
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
    font-weight: bold;
    font-size: 14px;
    z-index: 1;
    color: #333;
  }

  .line {
    position: absolute;
    border-top: 2px dashed rgba(0,0,0,0.3);
    transform-origin: 0 0;
    z-index: 0;
  }

  #monster {
    font-size: 120px;
    cursor: pointer;
    position: absolute;
    transition: top 1s ease-in-out, left 1s ease-in-out, transform 0.1s;
  }

  #monster.shake { animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px) rotate(-5deg); }
    75% { transform: translateX(10px) rotate(5deg); }
  }

  #hp-bar-container {
    width: 120px; height: 15px; background-color: #e0e0e0;
    border-radius: 10px; border: 2px solid #ccc; position: absolute;
    bottom: -30px; left: 50%; transform: translateX(-50%); overflow: hidden;
  }
  #hp-bar-fill {
    height: 100%; width: 100%;
    background: linear-gradient(to right, #ff416c, #ff4b2b);
    border-radius: 8px; transition: width 0.3s ease-out;
  }

  #victory-text {
    font-size: 80px;
    font-weight: bold;
    color: gold;
    position: absolute;
    opacity: 0;
    transition: opacity 0.5s;
  }

  #dungeon-prompt {
    position: absolute;
    background: rgba(0,0,0,0.05);
    border: 2px solid rgba(0,0,0,0.1);
    border-radius: 15px;
    padding: 25px 35px;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
    z-index: 20;
  }

  #detail-list {
    list-style: none;
    padding: 0;
    text-align: center;
    font-size: 24px;
    opacity: 0;
    transition: opacity 0.5s;
    pointer-events: none;
  }

  #detail-list li {
    background: rgba(0,0,0,0.05);
    padding: 10px 20px;
    margin: 10px;
    border-radius: 10px;
    border: 2px solid rgba(0,0,0,0.1);
    cursor: pointer;
  }

  #detail-list li:hover {
    background: rgba(0,0,0,0.1);
    transform: scale(1.05);
  }

  .back-button {
    position: absolute;
    top: 40px;
    left: 40px;
    font-size: 40px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="mindmap-container">
    <div id="center" class="node">오늘할 공부는?</div>
  </div>

  <div id="stage-container">
    <div id="monster">🐉</div>
    <div id="hp-bar-container"><div id="hp-bar-fill"></div></div>
    <div id="victory-text">VICTORY!</div>
    <div id="dungeon-prompt">
      <p>다음 던전으로 가시겠습니까?</p>
      <button id="dungeon-yes">Yes</button>
      <button id="dungeon-no">No</button>
    </div>
    <ul id="detail-list"></ul>
    <div class="back-button" id="back">←</div>
  </div>

  <script>
    const mindmapContainer = document.getElementById("mindmap-container");
    const stageContainer = document.getElementById("stage-container");
    const center = document.getElementById("center");
    const monster = document.getElementById("monster");
    const hpFill = document.getElementById("hp-bar-fill");
    const victory = document.getElementById("victory-text");
    const promptBox = document.getElementById("dungeon-prompt");
    const detailList = document.getElementById("detail-list");

    const categories = {
      "오늘할 공부는?": ["재미있는 과목", "재미없는 과목", "언어이야기"],
      "재미있는 과목": ["🎵 음악", "⚽ 체육"],
      "🎵 음악": ["가창", "악기"],
      "재미없는 과목": ["📘 국어", "🇬🇧 영어"],
      "📘 국어": ["화법과 작문", "언어와 매체"],
      "🇬🇧 영어": ["독해", "듣기", "문법"]
    };

    const colorMap = {
      // --- 👇 여기가 수정되었습니다! ---
      "오늘할 공부는?": "linear-gradient(135deg, #a865e1, #8e2de2)", // 더 선명한 보라색으로 변경
      // --- 👆 여기까지 ---
      "재미있는 과목": "linear-gradient(135deg, #ff7eb3, #ff758c)",
      "재미없는 과목": "linear-gradient(135deg, #56ccf2, #2f80ed)",
      "언어이야기": "linear-gradient(135deg, #fddb92, #d1fdff)",
      "🎵 음악": "linear-gradient(135deg, #ff9a9e, #fad0c4)",
      "⚽ 체육": "linear-gradient(135deg, #a1ffce, #faffd1)",
      "📘 국어": "linear-gradient(135deg, #89f7fe, #66a6ff)",
      "🇬🇧 영어": "linear-gradient(135deg, #ffecd2, #fcb69f)"
    };

    const monsters = {
      "default": "🐉", "🎵 음악": "🐲", "📘 국어": "🦕", "🇬🇧 영어": "🦎", "⚽ 체육": "🦖"
    };

    function positionCenter() {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      center.style.left = cx - center.offsetWidth / 2 + "px";
      center.style.top = cy - center.offsetHeight / 2 + "px";
    }
    
    positionCenter(); 
    window.addEventListener("resize", positionCenter);

    // 겹침 방지 로직이 포함된 함수 (수정 없음)
    function createNodes(parentName, parentNode, radius) {
      const children = categories[parentName];
      if (!children) return;
      if (parentNode.dataset.opened === "true") return;
      parentNode.dataset.opened = "true";
      
      const angleStep = (2 * Math.PI) / children.length;

      children.forEach((child, i) => {
        const angle = i * angleStep;
        const x = parentNode.offsetLeft + parentNode.offsetWidth / 2 + Math.cos(angle) * radius;
        const y = parentNode.offsetTop + parentNode.offsetHeight / 2 + Math.sin(angle) * radius;

        const node = document.createElement("div");
        node.className = "node";
        node.textContent = child;
        node.style.background = colorMap[child] || "gray";
        node.style.left = x - 50 + "px";
        node.style.top = y - 50 + "px";
        mindmapContainer.appendChild(node);

        const line = document.createElement("div");
        const dx = x - (parentNode.offsetLeft + parentNode.offsetWidth / 2);
        const dy = y - (parentNode.offsetTop + parentNode.offsetHeight / 2);
        const length = Math.sqrt(dx * dx + dy * dy);
        const angleDeg = Math.atan2(dy, dx) * (180 / Math.PI);
        line.className = "line";
        line.style.width = `${length - 50}px`;
        line.style.left = `${parentNode.offsetLeft + parentNode.offsetWidth / 2}px`;
        line.style.top = `${parentNode.offsetTop + parentNode.offsetHeight / 2}px`;
        line.style.transform = `rotate(${angleDeg}deg)`;
        mindmapContainer.appendChild(line);

        node.addEventListener("click", (e) => {
          e.stopPropagation();
          const sub = categories[child];
          if (sub) {
            // 하위 노드로 갈수록 거리를 80%씩 줄여서 겹치지 않게 함
            createNodes(child, node, radius * 0.8);
          } else {
            showBattle(child);
          }
        });
      });
    }

    function showBattle(subject) {
      mindmapContainer.style.opacity = 0;
      mindmapContainer.style.pointerEvents = "none";
      stageContainer.style.opacity = 1;
      stageContainer.style.pointerEvents = "auto";

      monster.textContent = monsters[subject] || monsters.default;
      let hp = 5;
      hpFill.style.width = "100%";
      victory.style.opacity = 0;
      promptBox.style.opacity = 0;
      promptBox.style.pointerEvents = "none";
      detailList.style.opacity = 0;
      detailList.innerHTML = "";

      monster.onclick = () => {
        if (hp <= 0) return;
        hp--;
        hpFill.style.width = (hp / 5) * 100 + "%";
        monster.classList.add("shake");
        setTimeout(() => monster.classList.remove("shake"), 300);
        if (hp === 0) {
          setTimeout(() => {
            victory.style.opacity = 1;
            setTimeout(() => {
              promptBox.style.opacity = 1;
              promptBox.style.pointerEvents = "auto";
            }, 1500);
          }, 300);
        }
      };

      document.getElementById("dungeon-yes").onclick = () => {
        const details = categories[subject];
        if (!details) return;
        promptBox.style.opacity = 0;
        detailList.innerHTML = "";
        details.forEach(item => {
          const li = document.createElement("li");
          li.textContent = item;
          li.onclick = () => {
            const search = `${subject} ${item}`;
            const url = `https://search.megastudy.net/?search_word=${encodeURIComponent(search)}`;
            window.open(url, "_blank");
          };
          detailList.appendChild(li);
        });
        detailList.style.opacity = 1;
      };

      document.getElementById("dungeon-no").onclick = () => {
        backToMap();
      };
    }

    function backToMap() {
      stageContainer.style.opacity = 0;
      stageContainer.style.pointerEvents = "none";
      mindmapContainer.style.opacity = 1;
      mindmapContainer.style.pointerEvents = "auto";
    }

    document.getElementById("back").onclick = backToMap;
    center.addEventListener("click", () => createNodes("오늘할 공부는?", center, 220));
  </script>
</body>
</html>
