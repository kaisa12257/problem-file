<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>과목 격파! 마인드맵</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(180deg, #e6f7ff 0%, #ffffff 100%);
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
    position: relative;
    color: #333;
  }

  *:focus {
    outline: none;
  }

  #mindmap-container, #stage-container {
    position: absolute;
    width: 100%;
    height: 100%;
    transition: opacity 0.5s ease-in-out;
    opacity: 0;
    pointer-events: none;
  }
  
  #mindmap-container {
      opacity: 1;
      pointer-events: auto;
  }

  .arcade {
    position: absolute;
    width: 90vw;
    height: 80vh;
    background: rgba(255, 255, 255, 0.4);
    border: 10px solid rgba(0, 0, 0, 0.05);
    border-radius: 40px;
    z-index: -1;
  }

  .arcade::before { content: '🕹️'; font-size: 80px; opacity: 0.2; position: absolute; bottom: 40px; left: 50%; transform: translateX(-120px); }
  .arcade::after { content: '🔴 🔵'; font-size: 55px; opacity: 0.2; position: absolute; bottom: 40px; left: 50%; transform: translateX(70px); }

  .node {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    position: absolute;
    cursor: pointer;
    border: 5px solid rgba(255,255,255,0.9);
    box-shadow: 0 0 25px rgba(0,0,0,0.1);
    font-weight: bold;
    font-size: 13px;
    z-index: 1;
    color: #333;
    box-sizing: border-box;
    transition: all 0.3s ease;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 5px;
    line-height: 1.2;
  }

  /* '재미없는 과목' 불타는 효과 */
  .node[data-category="재미없는 과목"] {
    border: 5px solid #ff4500;
    box-shadow: 0 0 15px #ff4500, 0 0 30px #ff8c00, 0 0 45px #ff6347;
    animation: pulseFire 1.5s infinite alternate;
  }
  @keyframes pulseFire {
    from { transform: scale(1); box-shadow: 0 0 15px #ff4500, 0 0 30px #ff8c00, 0 0 45px #ff6347; }
    to { transform: scale(1.03); box-shadow: 0 0 20px #ff6347, 0 0 40px #ffa500, 0 0 60px #ff4500; }
  }

  /* '재미있는 과목' 다이아몬드 효과 */
  .node[data-category="재미있는 과목"] {
    border: 5px solid #a8dadc;
    box-shadow: 0 0 10px #e0ffff, 0 0 20px #a8dadc, 0 0 30px #457b9d;
    animation: sparkleDiamond 2s infinite;
    background: linear-gradient(45deg, #a8dadc 0%, #f1faee 50%, #457b9d 100%);
  }
  @keyframes sparkleDiamond {
    0% { transform: scale(1) rotate(0deg); box-shadow: 0 0 10px #e0ffff, 0 0 20px #a8dadc, 0 0 30px #457b9d; }
    50% { transform: scale(1.02) rotate(3deg); box-shadow: 0 0 15px #ffffff, 0 0 25px #a8dadc, 0 0 35px #457b9d; }
    100% { transform: scale(1) rotate(0deg); box-shadow: 0 0 10px #e0ffff, 0 0 20px #a8dadc, 0 0 30px #457b9d; }
  }

  /* '언어 이야기' 포탈 효과 */
  .node[data-category="언어이야기"] {
    border: 5px solid #8e24aa;
    box-shadow: 0 0 15px #ba68c8, 0 0 30px #7b1fa2, 0 0 45px #4a148c;
    animation: portalGlow 2s infinite alternate;
    background: linear-gradient(135deg, #8e24aa, #42a5f5);
  }
  @keyframes portalGlow {
    from { border-color: #8e24aa; box-shadow: 0 0 15px #ba68c8, 0 0 30px #7b1fa2, 0 0 45px #4a148c; }
    to { border-color: #42a5f5; box-shadow: 0 0 20px #90caf9, 0 0 40px #64b5f6, 0 0 60px #42a5f5; }
  }


  .line {
    position: absolute; border-top: 2px dashed rgba(0,0,0,0.4);
    transform-origin: 0 0; z-index: 0;
  }

  #stage-container {
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
  }
  
  #instruction-text {
    position: absolute; top: 20%; font-size: 28px;
    font-weight: bold; color: #555; text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }

  .back-button {
    position: absolute; top: 40px; left: 40px; font-size: 40px;
    cursor: pointer; z-index: 10; color: #333;
  }

  #monster-area {
    position: absolute; width: 80%; height: 60%; top: 30%;
    display: flex; justify-content: center; align-items: center;
  }

  #monster {
    font-size: 120px; cursor: pointer; position: absolute;
    transition: top 1s ease-in-out, left 1s ease-in-out, transform 0.1s;
    font-family: 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif;
  }

  #monster.shake { animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px) rotate(-5deg); }
    75% { transform: translateX(10px) rotate(5deg); }
  }

  #hp-bar-container {
    width: 120px; height: 15px; background-color: #e0e0e0;
    border-radius: 10px; border: 2px solid #ccc; position: absolute;
    bottom: -30px; left: 50%; transform: translateX(-50%); overflow: hidden;
  }
  #hp-bar-fill {
    height: 100%; width: 100%;
    background: linear-gradient(to right, #ff416c, #ff4b2b);
    border-radius: 8px; transition: width 0.3s ease-out;
  }

  #victory-text {
    font-size: 100px; font-weight: bold; color: gold; position: absolute;
    opacity: 0; transition: opacity 0.5s; pointer-events: none;
    animation: sparkle 1.5s infinite;
  }
  
  @keyframes sparkle {
    0%, 100% { text-shadow: 0 0 10px #fff, 0 0 20px #ffc, 0 0 30px #ffae42; }
    50% { text-shadow: 0 0 20px #fff, 0 0 30px #ffc, 0 0 40px #ffae42, 0 0 50px #ff9900; }
  }

  #dungeon-prompt {
      position: absolute;
      background: rgba(0,0,0,0.05);
      border: 2px solid rgba(0,0,0,0.1);
      border-radius: 15px;
      padding: 25px 35px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s;
      z-index: 20;
  }
  #dungeon-prompt p {
      font-size: 22px;
      font-weight: bold;
      margin: 0 0 20px 0;
  }
  #dungeon-prompt button {
      font-size: 18px;
      font-weight: bold;
      padding: 10px 25px;
      margin: 0 10px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
  }
  #dungeon-prompt button:hover {
      transform: scale(1.05);
  }
  #dungeon-yes {
      background: linear-gradient(135deg, #a1ffce, #faffd1);
      color: #333;
  }
  #dungeon-no {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #333;
  }
  
  #detail-list {
    list-style: none; padding: 0; text-align: center; font-size: 24px;
    opacity: 0; transition: opacity 0.5s; pointer-events: none;
    position: absolute;
  }

  #detail-list li {
    background: rgba(0,0,0,0.05); padding: 10px 20px; margin: 10px;
    border-radius: 10px; border: 2px solid rgba(0,0,0,0.1);
    transition: background-color 0.3s, transform 0.2s;
    cursor: pointer;
  }

  #detail-list li:hover { background: rgba(0,0,0,0.1); transform: scale(1.05); }

</style>
</head>
<body>
  <div class="arcade"></div>

  <div id="mindmap-container">
    <div id="center" class="node">오늘할 공부는?</div>
  </div>

  <div id="stage-container">
    <div id="instruction-text">마우스로 몬스터를 잡으세요</div>
    <div class="back-button" id="stage-back-button">←</div>
    <div id="monster-area">
      <div id="monster">
        <div id="hp-bar-container">
          <div id="hp-bar-fill"></div>
        </div>
      </div>
    </div>
    <div id="victory-text">VICTORY</div>
    <div id="dungeon-prompt">
        <p>다음 던전으로 가시겠습니까?</p>
        <button id="dungeon-yes">Yes</button>
        <button id="dungeon-no">No</button>
    </div>
    <ul id="detail-list"></ul>
  </div>

  <script>
    const mindmapContainer = document.getElementById('mindmap-container');
    const center = document.getElementById('center');
    const stageContainer = document.getElementById('stage-container');
    const dungeonPromptEl = document.getElementById('dungeon-prompt');
    const dungeonYesButton = document.getElementById('dungeon-yes');
    const dungeonNoButton = document.getElementById('dungeon-no');

    const allNodes = [];
    const createdNodes = new Set();
    
    const mainCategories = ["재미있는 과목", "재미없는 과목", "언어이야기"];
    const childElementsByParent = {}; 

    const categories = {
        "오늘할 공부는?": mainCategories,
        "재미있는 과목": ["🎵 음악", "⚽ 체육"],
        "재미없는 과목": ["🏛️ 역사", "🌍 사회", "🧪 과학", "📘 국어", "🇬🇧 영어", "➗ 수학"],
        "언어이야기": ["🇨🇳 중국어", "🇯🇵 일본어"],
        "➗ 수학": ["수학 (상)", "수학 (하)", "수학 1", "수학 2", "미적분", "확률과 통계"],
        "🏛️ 역사": ["세계사", "한국사"], "🧪 과학": ["물리", "화학", "지구과학", "생명과학"],
        "🌍 사회": ["사회문화", "정치와 법", "윤리와 사상", "한국지리", "세계지리", "경제"],
        "🇬🇧 영어": ["독해", "듣기", "문법"], "📘 국어": ["화법과 작문", "언어와 매체"],
        "⚽ 체육": ["체육"], "🎵 음악": ["악기", "가창"],
        "🇨🇳 중국어": ["발음", "읽기", "쓰기", "문법"], "🇯🇵 일본어": ["발음", "읽기", "쓰기", "문법"],
    };

    const monsterMap = {
      "default": "🐉", "🎵 음악": "🐲", "⚽ 체육": "🦖", "📘 국어": "🦕", "🇬🇧 영어": "🦎",
      "➗ 수학": "🐉", "🧪 과학": "🐲", "🌍 사회": "🦖", "🏛️ 역사": "🦕",
      "🇨🇳 중국어": "🦎", "🇯🇵 일본어": "🐉",
    };

    const colorMap = {
      "오늘할 공부는?": 'linear-gradient(135deg, #b39ddb, #8e44ad)', 
      "재미있는 과목": 'linear-gradient(135deg, #ff7eb3, #ff758c)',
      "재미없는 과목": 'linear-gradient(135deg, #56ccf2, #2f80ed)', "언어이야기": 'linear-gradient(135deg, #fddb92, #d1fdff)',
      "🎵 음악": 'linear-gradient(135deg, #ff9a9e, #fad0c4)', "⚽ 체육": 'linear-gradient(135deg, #a1ffce, #faffd1)',
      "📘 국어": 'linear-gradient(135deg, #89f7fe, #66a6ff)', "🇬🇧 영어": 'linear-gradient(135deg, #ffecd2, #fcb69f)',
      "➗ 수학": 'linear-gradient(135deg, #a18cd1, #fbc2eb)', "🧪 과학": 'linear-gradient(135deg, #84fab0, #8fd3f4)',
      "🌍 사회": 'linear-gradient(135deg, #fccb90, #d57eeb)', "🏛️ 역사": 'linear-gradient(135deg, #f6d365, #fda085)',
      "🇨🇳 중국어": 'linear-gradient(135deg, #f093fb, #f5576c)', "🇯🇵 일본어": 'linear-gradient(135deg, #4facfe, #00f2fe)'
    };

    function positionCenter() {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      center.style.left = cx - center.offsetWidth / 2 + 'px';
      center.style.top = cy - center.offsetHeight / 2 + 'px';
    }

    window.addEventListener('load', () => {
      positionCenter();
      center.style.background = colorMap[center.textContent];
      
      const nodeW = center.offsetWidth, visualR = nodeW / 2;
      const centerX = center.offsetLeft + nodeW / 2;
      const centerY = center.offsetTop + nodeW / 2;
      allNodes.push({ element: center, x: centerX, y: centerY, visualR: visualR });
    });
    
    window.addEventListener('resize', positionCenter);

    const removeDescendants = (parentText) => {
        const childrenInfo = childElementsByParent[parentText];
        if (!childrenInfo) return;

        childrenInfo.nodes.forEach(childNode => {
            removeDescendants(childNode.textContent);
        });

        childrenInfo.nodes.forEach(nodeToRemove => {
            const index = allNodes.findIndex(n => n.element === nodeToRemove);
            if (index > -1) allNodes.splice(index, 1);
            createdNodes.delete(nodeToRemove.textContent);
            nodeToRemove.remove();
        });
        childrenInfo.lines.forEach(line => line.remove());
        delete childElementsByParent[parentText];
    };

    function createNodes(parentName, parentNode) {
        const nodesToCreate = categories[parentName];
        if (!nodesToCreate) return;

        const isDetailSubject = !mainCategories.includes(parentName) && parentName !== "오늘할 공부는?";
        if (isDetailSubject) {
            const childIsFinal = !categories[nodesToCreate[0]];
            if (childIsFinal) { showStage(parentName); return; }
        }

        const parentR = parentNode.offsetWidth / 2;
        const childR = 90 / 2;
        let radiusPadding = (nodesToCreate.length > 5) ? 120 : 90;
        const baseRadius = parentR + childR + radiusPadding;
        const angleStep = 360 / nodesToCreate.length;
        
        childElementsByParent[parentName] = { nodes: [], lines: [] };
        let angleOffset = (parentName === "재미없는 과목") ? 90 : 0;

        nodesToCreate.forEach((text, i) => {
            if (createdNodes.has(text)) return;
            
            let angle;
            if (parentName === "재미있는 과목") {
                angle = (i === 0 ? -90 : 90) * Math.PI / 180; 
            } else {
                angle = (i * angleStep + angleOffset) * Math.PI / 180;
            }

            let x = (parentNode.offsetLeft + parentNode.offsetWidth / 2) + Math.cos(angle) * baseRadius;
            let y = (parentNode.offsetTop + parentNode.offsetHeight / 2) + Math.sin(angle) * baseRadius;

            const nodeW = 90, visualR = nodeW / 2;

            let safe = false, tries = 0;
            while (!safe && tries < 500) {
              safe = true;
              for (const n of allNodes) {
                const dx = x - n.x;
                const dy = y - n.y;
                const dist = Math.hypot(dx, dy);
                
                const minDist = visualR + n.visualR + 30;
                
                if (dist < minDist) {
                  safe = false;
                  const push = (minDist - dist) * 0.5;
                  const angleAdjust = Math.atan2(dy, dx);
                  x += Math.cos(angleAdjust) * push;
                  y += Math.sin(angleAdjust) * push;
                }
              }
              x = Math.max(visualR + 10, Math.min(window.innerWidth - (visualR + 10), x));
              y = Math.max(visualR + 10, Math.min(window.innerHeight - (visualR + 10), y));
              tries++;
            }

            const node = document.createElement('div');
            node.className = 'node';
            node.innerHTML = `<span>${text}</span>`;
            node.style.background = colorMap[text] || 'gray';
            node.style.left = `${x - nodeW / 2}px`;
            node.style.top = `${y - nodeW / 2}px`;
            
            if (mainCategories.includes(text)) {
                node.setAttribute('data-category', text);
            }

            mindmapContainer.appendChild(node);
            
            const line = drawLine(parentNode, node);
            childElementsByParent[parentName].lines.push(line);
            childElementsByParent[parentName].nodes.push(node);

            allNodes.push({ element: node, x: x, y: y, visualR: visualR });
            createdNodes.add(text);

            node.addEventListener('click', (e) => {
                e.stopPropagation();
                const clickedNode = e.target.closest('.node');
                const clickedText = clickedNode.textContent;

                if (childElementsByParent[clickedText] && childElementsByParent[clickedText].nodes.length > 0) {
                    removeDescendants(clickedText);
                } else {
                    if (mainCategories.includes(clickedText)) {
                        mainCategories.forEach(category => {
                            if (category !== clickedText) {
                               removeDescendants(category);
                            }
                        });
                    } else {
                        const parentText = Object.keys(childElementsByParent).find(key => 
                            childElementsByParent[key].nodes.some(n => n === clickedNode)
                        );
                        if (parentText && childElementsByParent[parentText]) {
                            childElementsByParent[parentText].nodes.forEach(siblingNode => {
                                if (siblingNode !== clickedNode) {
                                    removeDescendants(siblingNode.textContent);
                                }
                            });
                        }
                    }
                    createNodes(clickedText, clickedNode);
                }
            });
        });
    }

    function drawLine(a, b) {
        const x1_center = a.offsetLeft + a.offsetWidth / 2;
        const y1_center = a.offsetTop + a.offsetHeight / 2;
        const x2_center = b.offsetLeft + b.offsetWidth / 2;
        const y2_center = b.offsetTop + b.offsetHeight / 2;

        const dx = x2_center - x1_center;
        const dy = y2_center - y1_center;

        const totalLength = Math.hypot(dx, dy);
        const angleRad = Math.atan2(dy, dx);
        const angleDeg = angleRad * 180 / Math.PI;

        const radiusA = a.offsetWidth / 2;
        const radiusB = b.offsetWidth / 2;

        const newLength = Math.max(0, totalLength - radiusA - radiusB);

        const startX = x1_center + Math.cos(angleRad) * radiusA;
        const startY = y1_center + Math.sin(angleRad) * radiusA;

        const line = document.createElement('div');
        line.className = 'line';
        line.style.width = `${newLength}px`;
        line.style.left = `${startX}px`;
        line.style.top = `${startY}px`;
        line.style.transform = `rotate(${angleDeg}deg)`;
        
        mindmapContainer.insertBefore(line, center); 
        return line;
    }

    center.addEventListener('click', () => {
        removeDescendants("오늘할 공부는?");
        createNodes('오늘할 공부는?', center);
    });
    
    let monsterMoveInterval = null;

    function showStage(subjectName) {
        mindmapContainer.style.opacity = '0';
        mindmapContainer.style.pointerEvents = 'none';
        stageContainer.style.opacity = '1';
        stageContainer.style.pointerEvents = 'auto';

        const instructionText = document.getElementById('instruction-text');
        const monsterArea = document.getElementById('monster-area');
        const monsterEl = document.getElementById('monster');
        const victoryTextEl = document.getElementById('victory-text');
        const detailListEl = document.getElementById('detail-list');
        
        instructionText.style.display = 'block';
        monsterArea.style.display = 'flex';
        victoryTextEl.style.opacity = '0';
        dungeonPromptEl.style.opacity = '0';
        dungeonPromptEl.style.pointerEvents = 'none';
        detailListEl.innerHTML = '';
        detailListEl.style.opacity = '0';
        detailListEl.style.pointerEvents = 'none';

        const monsterIcon = document.createTextNode(monsterMap[subjectName] || monsterMap['default']);
        monsterEl.innerHTML = '';
        monsterEl.appendChild(monsterIcon);
        const hpContainer = document.createElement('div');
        hpContainer.id = 'hp-bar-container';
        hpContainer.innerHTML = '<div id="hp-bar-fill"></div>';
        monsterEl.appendChild(hpContainer);
        
        const maxHp = 5;
        let monsterHp = maxHp;
        const newHpFill = monsterEl.querySelector('#hp-bar-fill');
        newHpFill.style.width = '100%';

        if (monsterMoveInterval) clearInterval(monsterMoveInterval);
        monsterMoveInterval = setInterval(() => {
            const areaRect = monsterArea.getBoundingClientRect();
            const monsterRect = monsterEl.getBoundingClientRect();
            const newTop = Math.random() * (areaRect.height - monsterRect.height);
            const newLeft = Math.random() * (areaRect.width - monsterRect.width);
            monsterEl.style.top = `${newTop}px`;
            monsterEl.style.left = `${newLeft}px`;
        }, 500);

        const onMonsterClick = () => {
            if (monsterHp <= 0) return;
            monsterHp--;
            newHpFill.style.width = `${(monsterHp / maxHp) * 100}%`;
            monsterEl.classList.add('shake');
            setTimeout(() => monsterEl.classList.remove('shake'), 300);

            if (monsterHp <= 0) {
                clearInterval(monsterMoveInterval);
                monsterEl.removeEventListener('click', onMonsterClick);
                
                setTimeout(() => {
                    instructionText.style.display = 'none';
                    monsterArea.style.display = 'none';
                    victoryTextEl.style.opacity = '1';
                }, 300);

                setTimeout(() => {
                    victoryTextEl.style.opacity = '0';
                    dungeonPromptEl.style.opacity = '1';
                    dungeonPromptEl.style.pointerEvents = 'auto';
                }, 2000);
            }
        };
        monsterEl.removeEventListener('click', onMonsterClick);
        monsterEl.addEventListener('click', onMonsterClick);

        dungeonYesButton.onclick = () => {
            dungeonPromptEl.style.opacity = '0';
            dungeonPromptEl.style.pointerEvents = 'none';
            const details = categories[subjectName];
            if (details) {
                details.forEach(item => {
                    const li = document.createElement('li');
                    li.textContent = item;
                    
                    // ✨ [수정] 클릭 시 과목명 포함하여 구글 검색
                    li.addEventListener('click', () => {
                        // subjectName에서 이모지와 앞 공백 제거 (예: '➗ 수학' -> '수학')
                        const cleanSubjectName = subjectName.substring(2);
                        // 검색어 조합
                        const searchTerm = `${cleanSubjectName} ${item} 공부법`;
                        const googleUrl = `https://www.google.com/search?q=${encodeURIComponent(searchTerm)}`;
                        window.open(googleUrl, '_blank');
                    });
                    
                    detailListEl.appendChild(li);
                });
                detailListEl.style.opacity = '1';
                detailListEl.style.pointerEvents = 'auto';
            }
        };

        dungeonNoButton.onclick = () => {
            document.getElementById('stage-back-button').click();
        };
    }
    
    document.getElementById('stage-back-button').addEventListener('click', () => {
        mindmapContainer.style.opacity = '1';
        mindmapContainer.style.pointerEvents = 'auto';
        stageContainer.style.opacity = '0';
        stageContainer.style.pointerEvents = 'none';
        if (monsterMoveInterval) clearInterval(monsterMoveInterval);
    });

  </script>
</body>
