<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>이벤트 객체의 target</title>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const listItems = document.getElementsByTagName("li");
            for (let i = 0; i < listItems.length; i++) {
                listItems[i].addEventListener('click', function(event) {
                    for (let j = 0; j < listItems.length; j++) {
                        listItems[j].style.fontSize = '1em';
                        listItems[j].style.transition = 'font-size 0.2s';
                    }
                    event.target.style.fontSize = '1.3em';
                });
            }
        });
    </script>
</head>
<body>
    <h3>아이템을 클릭하면 글자가 1.3배 커지게</h3>
    <hr>
    <p>여름 방학 때 하고 싶은 것들</p>
    <ul>
        <li>자전거로 대한민국 일주</li>
        <li>책 100권 읽기</li>
        <li>철인 3종 경기 준비</li>
        <li>자바스크립트 정복</li>
    </ul>
</body>
</html>
