<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>DOM 객체 동적 삽입</title>
<script>
function addAnswer(obj, text) {
  const next = obj.nextElementSibling;
  if (next && next.tagName === "P") {
    next.remove();
  } else {
    const p = document.createElement("p");
    p.textContent = text;
    p.style.cursor = "pointer";
    p.onclick = function() {
      this.remove();
    };
    obj.after(p);
  }
}
</script>
</head>
<body>
<h3>정답의 동적 삽입</h3>
<div id="answer">
  <p>Q. 거울아 거울아 세상에서 누가 제일 예쁘니?</p>
  <button onclick="addAnswer(this, '백설공주')">답 보기</button>
  <hr>
  <p>Q. 죽느냐 사느냐 어떤 것이 문제인가?</p>
  <button onclick="addAnswer(this, '둘다')">답 보기</button>
</div>
</body>
</html>
