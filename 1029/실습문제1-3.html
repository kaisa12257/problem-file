<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>라면 끓이는 순서 예제</title>
    <style>
        ol {
            padding: 20px;
            width: 300px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
    </style>
</head>
<body>

    <h1> 라면을 끓이는 순서</h1>
<hr>
    <ol type="A" onclick="this.style.backgroundColor = 'yellowgreen';">
        <li>물을 끓인다.</li>
        <li>라면과 스프를 넣는다.</li>
        <li>파를 썰어 넣는다.</li>
        <li>5분 후 맛있게 먹는다.</li>
    </ol>

</body>
</html>
