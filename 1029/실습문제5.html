<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>z-index 카드</title>
<style>
  div { position: relative; width:120px; height:160px; margin:50px auto; }
  img { position:absolute; width:100px; height:140px; left:10px; top:10px; cursor:pointer; }
</style>
</head>
<body>
<h2>z-index 스타일 프로퍼티</h2>
<hr>
<div>
  <img src="file:///E:/과제4/1.png" style="z-index:4">
  <img src="file:///E:/과제4/2.png" style="z-index:3">
  <img src="file:///E:/과제4/3.png" style="z-index:2">
  <img src="file:///E:/과제4/4.png" style="z-index:1">
</div>
<script>
  const c = document.querySelectorAll("img");
  c.forEach(i => i.onclick = () => {
    i.style.zIndex = 0;
    c.forEach(j => { if (j !== i) j.style.zIndex = +j.style.zIndex + 1 });
  });
</script>
</body>
</html>
