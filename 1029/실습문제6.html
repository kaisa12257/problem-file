<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>innerHTML</title>
</head>
<body>
    <h3>innerHTML</h3>
    <hr>
    <h2 id="question" style="cursor: pointer;">
        이번 여름에는 어디로 여행을 갈<br>까요?
    </h2>

    <script>
        const question = document.getElementById("question");

        question.onclick = function() {
            const input = prompt("HTML 텍스트 혹은 그냥 텍스트를 입력하세요");
            if (input !== null && input.trim() !== "") {
                document.open();
                document.write("<h3>innerHTML</h3><hr>");
                document.write(input);
                document.close();
            }
        };
    </script>
</body>
</html>
