<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>마우스 클릭 연습</title>
<style>
  body { text-align: center; }
  img { width: 300px; transition: transform 0.2s; }
</style>
</head>
<body>
  <h3>마우스 휠을 이용한 이미지 확대 축소</h3>
  <hr>
  <h2>이미지 위에 휠을 위로 굴리면 축소되고,<br>아래로 굴리면 확대됩니다.</h2>

  <img id="pic" src="망고.jpg" alt="이미지">

  <script>
    const img = document.getElementById("pic");
    let scale = 1.0;
    img.addEventListener("wheel", function(e) {
      e.preventDefault();
      if (e.deltaY < 0) scale += 0.05;
      else scale -= 0.05;
      if (scale < 0.1) scale = 0.1;
      img.style.transform = `scale(${scale})`;
    });
  </script>
</body>
</html>
