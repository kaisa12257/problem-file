<!DOCTYPE html>
<html>
<head>
    <title>자바스크립트 연습</title>
    
    <script>
        function applyBorder() {
            // id가 "mySpan"인 요소를 찾습니다.
            var spanElement = document.getElementById("mySpan");
            
            // 해당 요소의 border 스타일을 "2px dotted violet"으로 설정합니다.
            spanElement.style.border = "2px dotted violet";
        }
    </script>
</head>
<body>
    <h3>자바스크립트란?</h3>
    
    <button onclick="applyBorder()">border</button>
    <button>p</button>
    
    <p>자바스크립트는 웹 프로그래밍 언어로서<br> 웹 페이지를 동적 변경시킬 수 있다.</p>
    <p><span id="mySpan">C 언어</span>를 아는 사용자는 빠르게 학습할<br> 수 있다.</p>
    <p>이벤트 등 GUI 프로그래밍에 필요한 요소<br>들이 있어 학습에 약간의 어려움이 있다.</p>
</body>
</html>
