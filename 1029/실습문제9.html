<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>라면을 끓이는 순서</title>
<script>
function addStep() {
  let text = prompt("라면을 끓이는 순서를 입력하라");
  if (text) {
    let li = document.createElement("li");
    li.textContent = text;
    li.onclick = addStep;
    document.querySelector("ol").appendChild(li);
  }
}
</script>
</head>
<body>
<h3>라면을 끓이는 순서</h3>
<hr>
<ol type="A" style="background-color:yellowgreen">
  <li onclick="addStep()">물을 끓인다.</li>
</ol>
</body>
</html>
