<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>이미지 커서 따라가기</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #fffaf0;
    cursor: none;
  }
  #cursorBox {
    position: absolute;
    width: 30px;
    height: 30px;
    pointer-events: none;
  }
  #cursorBox img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
  }
</style>
</head>
<body>
  <h3>이미지 커서 만들기</h3>
  <hr>
  <h2>마우스를 움직이면 이미지로 만든 커서 <br>가 마우스를 따라다닙니다.</h2>

  <div id="cursorBox">
    <img src="망고.jpg" alt="커서 이미지">
  </div>

  <script>
    const cursorBox = document.getElementById("cursorBox");
    document.addEventListener("mousemove", function(e) {
      cursorBox.style.left = (e.pageX - 15) + "px";
      cursorBox.style.top = (e.pageY - 15) + "px";
    });
  </script>
</body>
</html>
